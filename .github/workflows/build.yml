name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -rf app/src/main/res/mipmap-anydpi-v26
      - run: rm -f app/src/main/res/mipmap-hdpi/ic_launcher.xml app/src/main/res/mipmap-mdpi/ic_launcher.xml app/src/main/res/mipmap-xhdpi/ic_launcher.xml app/src/main/res/mipmap-xxhdpi/ic_launcher.xml app/src/main/res/mipmap-xxxhdpi/ic_launcher.xml
      - run: ls -l icon.png
      - run: for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; cp -f icon.png app/src/main/res/mipmap-$d/ic_launcher.png; cp -f icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: |
          mv Gradle gradle 2>/dev/null || true
          ls -la
          find . -type f -name gradlew | head -10
          GW=$(find . -type f -name gradlew | head -1)
          echo "Ketemu $GW"
          chmod +x $GW
          cp -f $GW ./gradlew
          chmod +x ./gradlew
          ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
