name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FIX ICON REAL - RESIZE
        run: |
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -rf app/src/main/res/mipmap-anydpi-v33
          rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
          python3 - << 'PY'
          from PIL import Image
          import os
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          src="icon.png"
          im=Image.open(src).convert("RGBA")
          for d,s in sizes.items():
              p=f"app/src/main/res/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              out=im.resize((s,s), Image.LANCZOS)
              out.save(f"{p}/ic_launcher.png")
              out.save(f"{p}/ic_launcher_round.png")
              print(f"buat {p} {s}x{s}")
          PY
          ls -lh app/src/main/res/mipmap-hdpi/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-APK-FIXED-ICON-KECIL
          path: app/build/outputs/apk/debug/app-debug.apk
