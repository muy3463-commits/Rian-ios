name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert icon.png to launcher
        run: |
          pip install pillow -q
          python3 -c "
          from PIL import Image
          import os, shutil
          base='app/src/main/res'
          # hapus adaptive icon yang bikin error
          for p in [base+'/mipmap-anydpi-v26', base+'/mipmap-anydpi-v33']:
              if os.path.exists(p):
                  shutil.rmtree(p)
          if not os.path.exists('icon.png'):
              print('icon.png not found')
              exit(0)
          im=Image.open('icon.png').convert('RGBA')
          for dn,sz in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              d=os.path.join(base,f'mipmap-{dn}')
              os.makedirs(d, exist_ok=True)
              r=im.resize((sz,sz), Image.LANCZOS)
              r.save(os.path.join(d,'ic_launcher.png'))
              r.save(os.path.join(d,'ic_launcher_round.png'))
          print('icon done')
          "
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.5; fi
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-ios-debug
          path: app/build/outputs/apk/debug/app-debug.apk
