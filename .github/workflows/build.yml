name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install pillow -q
      - name: FIX TOTAL 88
        run: |
          cat app/src/main/AndroidManifest.xml
          ls -lh icon.png
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -rf app/src/main/res/mipmap-anydpi-v33
          rm -rf app/src/main/res/drawable
          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
          sed -i 's/android:roundIcon="[^"]*"//g' app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml
          cat app/src/main/AndroidManifest.xml
          python3 << 'PY'
          from PIL import Image
          import os
          sizes={"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          im=Image.open("icon.png").convert("RGBA")
          for d,s in sizes.items():
              p=f"app/src/main/res/mipmap-{d}"
              os.makedirs(p, exist_ok=True)
              im.resize((s,s), Image.LANCZOS).save(f"{p}/ic_launcher.png")
              im.resize((s,s), Image.LANCZOS).save(f"{p}/ic_launcher_round.png")
          print("DONE")
          PY
          find app/src/main/res -type f
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-FIX-88-PATCH-MANIFEST
          path: app/build/outputs/apk/debug/app-debug.apk
