name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HAPUS TOTAL ROBOT - FIX ICON PERMANEN
        run: |
          echo "=== CARI icon.png ==="
          find. -name "icon.png" -type f
          ICON_PATH=$(find. -name "icon.png" -type f | head -n1)
          echo "Pakai icon: $ICON_PATH"

          echo "=== HAPUS SEMUA ADAPTIVE ICON ROBOT ==="
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -rf app/src/main/res/mipmap-anydpi-v33
          find app/src/main/res -name "ic_launcher*.xml" -delete
          find app/src/main/res -name "ic_launcher_*.xml" -delete
          find app/src/main/res -name "*launcher*foreground*" -delete
          find app/src/main/res -name "*launcher*background*" -delete

          echo "=== SISA FILE LAUNCHER (harus kosong xml) ==="
          find app/src/main/res -name "*launch*"

          echo "=== COPY ICON.PNG KE SEMUA MIPMAP ==="
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
            cp -fv $ICON_PATH app/src/main/res/mipmap-$d/ic_launcher.png
            cp -fv $ICON_PATH app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp -fv $ICON_PATH app/src/main/res/mipmap-$d/ic_launcher_foreground.png
            ls -lh app/src/main/res/mipmap-$d/
          done

          echo "=== VERIFIKASI AKHIR ==="
          find app/src/main/res/mipmap-* -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-APK-FINAL-REAL-ICON
          path: app/build/outputs/apk/debug/app-debug.apk
