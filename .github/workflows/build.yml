name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix icon paksa
        run: |
          mv Gradle gradle 2>/dev/null || true
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
          ls -l icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p app/src/main/res/mipmap-$d; cp -f icon.png app/src/main/res/mipmap-$d/ic_launcher.png; cp -f icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
