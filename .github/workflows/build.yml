name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FIX ICON
        run: |
          ls -l
          rm -rf app/src/main/res/mipmap-anydpi-v26
          rm -rf app/src/main/res/mipmap-anydpi-v33
          rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
          rm -f app/src/main/res/mipmap-*/ic_launcher*.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
            cp -f icon.png app/src/main/res/mipmap-$d/ic_launcher.png
            cp -f icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          ls app/src/main/res/mipmap-hdpi/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle clean assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-APK-FINAL-REAL-ICON
          path: app/build/outputs/apk/debug/app-debug.apk
