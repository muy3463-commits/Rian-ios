name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: RESTORE GRADLEW
        run: |
          for c in $(git log --all --pretty=format:%H -- gradlew | head -5); do git checkout $c -- gradlew gradle/wrapper/ 2>/dev/null && break; done
          chmod +x gradlew || true
      - name: MAKE ICON RIAN APK
        run: |
          pip install pillow -q
          python3 << 'PY'
          from PIL import Image
          import os, shutil
          src="icon.png"
          base="app/src/main/res"
          for p in [f"{base}/mipmap-anydpi-v26", f"{base}/mipmap-anydpi-v33"]:
            if os.path.exists(p): shutil.rmtree(p)
          im=Image.open(src).convert("RGBA")
          for dn,sz in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
            os.makedirs(f"{base}/mipmap-{dn}", exist_ok=True)
            r=im.resize((sz,sz), Image.LANCZOS)
            r.save(f"{base}/mipmap-{dn}/ic_launcher.png")
            r.save(f"{base}/mipmap-{dn}/ic_launcher_round.png")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-ios-debug
          path: app/build/outputs/apk/debug/app-debug.apk
