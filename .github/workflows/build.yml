name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Benerin folder & icon
        run: |
          mv Gradle gradle 2>/dev/null || true
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rian-APK-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
